services:
  web:
    build:
      context: .
      target: nginx
    ports:
      - "${QR_BIND_ADDRESS:-127.0.0.1}:${QR_PORT:-8784}:8080"
    depends_on:
      - php
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  php:
    build:
      context: .
      target: php
    volumes:
      - signing-keys:/var/cache/auth-qr
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
volumes:
  signing-keys:
