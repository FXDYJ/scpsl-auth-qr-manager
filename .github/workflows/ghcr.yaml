name: Publish GHCR images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghcr-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: nginx
            image: ghcr.io/fxdyj/scpsl-auth-qr-manager
          - target: php
            image: ghcr.io/fxdyj/scpsl-auth-qr-manager-php
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'

  smoke-test:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      QR_IMAGE_TAG: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Test published Compose stack
        shell: bash
        run: |
          docker compose -f compose.ghcr.yaml up -d
          curl -fsS --retry 8 --retry-all-errors --retry-delay 1 --max-time 10 http://127.0.0.1:8784/ -o /dev/null
          curl -fsS --retry 8 --retry-all-errors --retry-delay 1 --max-time 10 http://127.0.0.1:8784/api/keys.php | jq -e '.documents | length > 0'
          curl -fsS http://127.0.0.1:8784/manifest.webmanifest | jq -e '.display == "standalone"'
          curl -fsS http://127.0.0.1:8784/sw.js -o /dev/null
          curl -fsS http://127.0.0.1:8784/vendor/zxing_reader.wasm -o /dev/null
      - name: Show container logs
        if: failure()
        run: docker compose -f compose.ghcr.yaml logs
      - name: Stop test stack
        if: always()
        run: docker compose -f compose.ghcr.yaml down -v
