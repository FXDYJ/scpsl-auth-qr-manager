server {
    listen 8080;
    server_name _;
    root /app/public;
    index index.html;
    server_tokens off;
    client_max_body_size 1k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header Cache-Control "no-cache" always;

    location = /api/keys.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/api/keys.php;
        fastcgi_pass php:9000;
        fastcgi_read_timeout 12s;
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ =404; }
}
